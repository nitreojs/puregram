name: codeql

on:
  push:
    branches: [v3, lord]
  pull_request:
    branches: [v3, lord]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [typescript]

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: init codeql
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: analyze
        uses: github/codeql-action/analyze@v4
