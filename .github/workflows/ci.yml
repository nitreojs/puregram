name: ci

on:
  pull_request:
    branches: [v3, lord]
  push:
    branches: [v3, lord]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: build + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: enable corepack
        run: corepack enable

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: install
        run: yarn install --immutable

      - name: build
        run: yarn build

      - name: verify codegen
        run: yarn workspace @puregram/api verify

      - name: typecheck
        run: yarn typecheck

      - name: lint
        run: yarn lint

      - name: test
        run: yarn test

  docs:
    name: docs build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: enable corepack
        run: corepack enable

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: install
        run: yarn install --immutable

      - name: build docs
        run: yarn workspace docs docs:build
